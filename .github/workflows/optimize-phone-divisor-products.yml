name: Optimize PowerVR divisor products

on:
  push:
    branches:
      - experiment/powervr-phone-fastpath

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[divisor-products]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Collapse explicit divisor transcendental work
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shader_path = Path('android/app/src/main/assets/continuation.frag.in')
          shader = shader_path.read_text()

          marker = '''vec2 holomorphic_q(vec2 z) {\n'''
          helper = '''void accumulate_complex_product(\n    inout vec2 product,\n    inout float logarithmic_scale,\n    vec2 factor\n) {\n    if (dot(factor, factor) < 1.0e-16) {\n        factor = vec2(1.0e-8, 0.0);\n    }\n\n    product = complex_multiply(product, factor);\n    float scale = max(abs(product.x), abs(product.y));\n    if (scale > 1.0e8 || scale < 1.0e-8) {\n        product /= scale;\n        logarithmic_scale += log(scale);\n    }\n}\n\nvoid add_complex_product_contribution(\n    vec2 product,\n    float logarithmic_scale,\n    float sign,\n    inout float phase,\n    inout float log_modulus\n) {\n    float scale = max(max(abs(product.x), abs(product.y)), 1.0e-20);\n    vec2 normalized = product / scale;\n    phase += sign * atan(normalized.y, normalized.x);\n    log_modulus += sign * (\n        logarithmic_scale\n        + log(scale)\n        + 0.5 * log(max(dot(normalized, normalized), 1.0e-16))\n    );\n}\n\n'''
          if shader.count(marker) != 1:
              raise SystemExit('holomorphic_q marker mismatch')
          shader = shader.replace(marker, helper + marker, 1)

          start = shader.index('    // R(z): the explicit meromorphic divisor on the ordinary complex plane.')
          end = shader.index('    vec3 color = wegert_color_from_phase_log_modulus(phase, log_modulus);', start)
          replacement = '''    // R(z): accumulate all explicit zeros and poles with complex multiplies.\n    // Extract phase/log-modulus only once for the numerator and denominator.\n    // This keeps adding many user zeros cheap enough for the PowerVR phone and\n    // preserves analytic cancellation when zeros approach wandering poles.\n    vec2 zero_product = vec2(1.0, 0.0);\n    float zero_logarithmic_scale = 0.0;\n    for (int index = 0; index < MAX_FACTORS; ++index) {\n        if (index >= u_zero_count) break;\n        accumulate_complex_product(\n            zero_product,\n            zero_logarithmic_scale,\n            z - u_zero_positions[index]\n        );\n    }\n\n    vec2 pole_product = vec2(1.0, 0.0);\n    float pole_logarithmic_scale = 0.0;\n    for (int index = 0; index < MAX_FACTORS; ++index) {\n        if (index >= u_pole_count) break;\n        accumulate_complex_product(\n            pole_product,\n            pole_logarithmic_scale,\n            z - u_pole_positions[index]\n        );\n    }\n\n    // The 24 wanderers are persistent poles, but their divisor contribution\n    // can be canceled by user zeros exactly like any mathematical pole factor.\n    for (int index = 0; index < REMOTE_POLE_COUNT; ++index) {\n        accumulate_complex_product(\n            pole_product,\n            pole_logarithmic_scale,\n            z - u_remote_pole_positions[index]\n        );\n    }\n\n    add_complex_product_contribution(\n        zero_product, zero_logarithmic_scale, 1.0, phase, log_modulus\n    );\n    add_complex_product_contribution(\n        pole_product, pole_logarithmic_scale, -1.0, phase, log_modulus\n    );\n\n'''
          shader = shader[:start] + replacement + shader[end:]
          shader_path.write_text(shader)

          test_path = Path('tests/test_wegert_color_parity.py')
          test = test_path.read_text()
          old = '''        value_tokens = (\n            "vec2 q = holomorphic_q(z);",\n            phase_reduction,\n            modulus_reduction,\n            "phase += atan(delta.y, delta.x);",\n            "log_modulus += 0.5 * log(radius_squared);",\n            "phase -= atan(delta.y, delta.x);",\n            "log_modulus -= 0.5 * log(radius_squared);",\n            "phase -= atan(remote_product.y, remote_product.x);",\n            "log_modulus -= log(remote_scale)",\n        )\n'''
          new = '''        value_tokens = (\n            "vec2 q = holomorphic_q(z);",\n            phase_reduction,\n            modulus_reduction,\n            "vec2 zero_product = vec2(1.0, 0.0);",\n            "vec2 pole_product = vec2(1.0, 0.0);",\n            "z - u_zero_positions[index]",\n            "z - u_pole_positions[index]",\n            "z - u_remote_pole_positions[index]",\n            "zero_product, zero_logarithmic_scale, 1.0, phase, log_modulus",\n            "pole_product, pole_logarithmic_scale, -1.0, phase, log_modulus",\n        )\n'''
          if test.count(old) != 1:
              raise SystemExit('Wegert value-token test block mismatch')
          test_path.write_text(test.replace(old, new, 1))
          PY

          git diff --check
          grep -Fq 'vec2 zero_product = vec2(1.0, 0.0);' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'vec2 pole_product = vec2(1.0, 0.0);' android/app/src/main/assets/continuation.frag.in
          ! grep -Fq 'phase += atan(delta.y, delta.x);' android/app/src/main/assets/continuation.frag.in
          ! grep -Fq 'phase -= atan(delta.y, delta.x);' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'can be canceled by user zeros' android/app/src/main/assets/continuation.frag.in
          python -m unittest discover -s tests -v

          git config user.name i
          git config user.email isomorphisms@sdf.org
          git add android/app/src/main/assets/continuation.frag.in tests/test_wegert_color_parity.py
          git commit -m 'Collapse phone divisor products [divisor-products]'
          git push origin HEAD:experiment/powervr-phone-fastpath
