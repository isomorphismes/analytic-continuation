name: Refactor runtime acceptance

on:
  push:
    branches:
      - refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-runtime-acceptance
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Host motion/scenario acceptance
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_scene_motion.c \
            android/app/src/main/cpp/scene.c \
            android/app/src/main/cpp/motion.c \
            android/app/src/main/cpp/presentation.c \
            android/app/src/main/cpp/scenario.c \
            -lm -o /tmp/test-scene-motion
          /tmp/test-scene-motion

      - name: Build interactive APK with lean entire shader
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Preserve interactive APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/interactive.apk"

      - name: Build clean stronger-soup video APK from scenario data
        run: |
          cp scenarios/video-demo.conf android/app/src/main/assets/scenario.conf
          cd android
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/video-demo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: refactor-interactive-apk
          path: ${{ runner.temp }}/interactive.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: refactor-video-demo-apk
          path: ${{ runner.temp }}/video-demo.apk
          if-no-files-found: error

  interactive-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: refactor-interactive-apk
          path: artifacts

      - name: Install screenshot comparison support
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run interactive app continuously
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size 270x480
            adb shell wm density 160
            bash ci/emulate_interactive.sh artifacts/interactive.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-interactive-runtime-evidence
          path: |
            holomorphic-emulator.log
            holomorphic-emulator.png
            holomorphic-motion-a.png
            holomorphic-motion-b.png
          if-no-files-found: warn

  video-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: refactor-video-demo-apk
          path: artifacts

      - name: Install screenshot comparison support
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run clean stronger-soup app continuously
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: bash ci/emulate_video_demo.sh artifacts/video-demo.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-video-runtime-evidence
          path: |
            video-demo.log
            video-demo-a.png
            video-demo-b.png
          if-no-files-found: warn
