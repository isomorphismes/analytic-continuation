name: Build and publish APK

on:
  push:
    branches:
      - apk-release
    paths:
      - '.github/workflows/apk-release.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: APK version without a leading v
        required: true
        default: 0.1.0
        type: string
      version_code:
        description: Positive Android version code
        required: true
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: apk-release-analytic-continuation
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.release_version || '0.1.0' }}
  RELEASE_VERSION_CODE: ${{ inputs.version_code || '1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate release identity
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$RELEASE_VERSION_CODE" -le 2100000000

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev xvfb xauth libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install -e '.[movie]'

      - name: Test movie contracts
        run: python -m unittest discover -s tests -v

      - name: Render bundled movies
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          ANALYTIC_CONTINUATION_SPEC="$GITHUB_WORKSPACE/examples/zeta_smoke.json" \
            xvfb-run -a manimgl \
              src/analytic_continuation/scene.py FunctionOpenClose \
              -w -l \
              --video_dir rendered \
              --file_name zeta-open-close
          ANALYTIC_CONTINUATION_SPEC="$GITHUB_WORKSPACE/examples/rational_disc_reveal_smoke.json" \
            xvfb-run -a manimgl \
              src/analytic_continuation/scene.py FunctionOpenClose \
              -w -l \
              --video_dir rendered \
              --file_name rational-disc-reveal
          find rendered -type f -name 'zeta-open-close.mp4' \
            -exec cp '{}' android/app/src/main/assets/movies/ \;
          find rendered -type f -name 'rational-disc-reveal.mp4' \
            -exec cp '{}' android/app/src/main/assets/movies/ \;
          test -s android/app/src/main/assets/movies/zeta-open-close.mp4
          test -s android/app/src/main/assets/movies/rational-disc-reveal.mp4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build signed test APK
        working-directory: android
        env:
          PLAY_VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
          PLAY_VERSION_NAME: ${{ env.RELEASE_VERSION }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and name APK
        run: |
          set -euo pipefail
          source_apk=android/app/build/outputs/apk/debug/app-debug.apk
          release_apk="analytic-continuation-${RELEASE_VERSION}.apk"
          test -s "$source_apk"
          unzip -t "$source_apk"
          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq AndroidManifest.xml "$RUNNER_TEMP/apk-files.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$source_apk"
          cp "$source_apk" "$release_apk"
          sha256sum "$release_apk" > "${release_apk}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-${{ env.RELEASE_VERSION }}-apk
          path: |
            analytic-continuation-${{ env.RELEASE_VERSION }}.apk
            analytic-continuation-${{ env.RELEASE_VERSION }}.apk.sha256
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-${{ env.RELEASE_VERSION }}-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and start the movie viewer
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: medium_phone
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r "artifacts/analytic-continuation-${RELEASE_VERSION}.apk"
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.analyticcontinuation/.MainActivity
            sleep 3
            adb shell pidof -s org.isomorphisms.analyticcontinuation | tr -d '\r' | grep -Eq '^[0-9]+$'
            adb shell uiautomator dump /sdcard/analytic-continuation.xml
            adb pull /sdcard/analytic-continuation.xml .
            grep -Fq 'Analytic Continuation' analytic-continuation.xml
            grep -Fq 'Choose a function movie.' analytic-continuation.xml
            grep -Fq 'Zeta Open Close' analytic-continuation.xml
            grep -Fq 'Rational Disc Reveal' analytic-continuation.xml
            adb exec-out screencap -p > analytic-continuation.png
            adb logcat -d > analytic-continuation.log
            ! grep -Fq 'FATAL EXCEPTION: main' analytic-continuation.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-emulator-evidence
          path: |
            analytic-continuation.log
            analytic-continuation.png
            analytic-continuation.xml
          if-no-files-found: warn

  publish:
    needs: emulate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-${{ env.RELEASE_VERSION }}-apk
          path: release

      - name: Verify tested files
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -c "analytic-continuation-${RELEASE_VERSION}.apk.sha256"
          unzip -t "analytic-continuation-${RELEASE_VERSION}.apk"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          release_title="Analytic Continuation Android test ${RELEASE_VERSION}"
          release_notes="Installable offline movie-viewer APK from commit ${GITHUB_SHA}.

          It contains the Riemann-zeta open/close movie and the rational disc-reveal movie. The contract tests, signed-APK checks, and an Android emulator install/start/UI check passed before publication.

          This GitHub prerelease is signed with the repository's public test-only key. It is not the separately signed Google Play production build."

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes "$release_notes" \
              --prerelease
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes" \
              --prerelease
          fi

          gh release upload "$release_tag" \
            "release/analytic-continuation-${RELEASE_VERSION}.apk" \
            "release/analytic-continuation-${RELEASE_VERSION}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
