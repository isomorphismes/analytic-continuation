name: Repeated-root Cauchy motion

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/repeated-root-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repeated-root-cauchy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build repeated-root test APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repeated-root-cauchy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: repeated-root-cauchy-apk
          path: artifacts

      - name: Install screenshot comparison support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise eight nearly coincident zeros
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 4
            adb logcat -d > repeated-root-emulator.log
            grep -Fq 'Cauchy field ready:' repeated-root-emulator.log
            bash tests/seed_repeated_zeros.sh repeated-root-emulator.log /tmp/cauchy-repeated-zero-cluster
            sleep 2
            adb logcat -d > repeated-root-emulator.log
            grep -Eq 'zero added: .*count=8' repeated-root-emulator.log
            adb exec-out screencap -p > repeated-root-motion-a.png
            sleep 6
            adb exec-out screencap -p > repeated-root-motion-b.png
            python3 tests/check_cauchy_motion.py repeated-root-motion-a.png repeated-root-motion-b.png --exclude-file /tmp/cauchy-repeated-zero-cluster --min-mean 1.0 --min-changed-fraction 0.08
            python3 tests/check_cauchy_structure_motion.py repeated-root-motion-a.png repeated-root-motion-b.png --exclude-file /tmp/cauchy-repeated-zero-cluster
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|Cauchy field shader uniforms unavailable|FATAL EXCEPTION' repeated-root-emulator.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: repeated-root-cauchy-evidence
          path: |
            repeated-root-emulator.log
            repeated-root-motion-a.png
            repeated-root-motion-b.png
          if-no-files-found: warn
