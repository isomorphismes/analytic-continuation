name: Holomorphic Random Explorer APK

on:
  push:
    branches:
      - refactor
    paths:
      - 'android/**'
      - 'ci/**'
      - 'scenarios/**'
      - 'tests/test_holomorphic_walk.c'
      - 'tests/test_scene_motion.c'
      - 'tests/check_motion_screenshots.py'
      - '.github/workflows/holomorphic-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'ci/**'
      - 'scenarios/**'
      - 'tests/test_holomorphic_walk.c'
      - 'tests/test_scene_motion.c'
      - 'tests/check_motion_screenshots.py'
      - '.github/workflows/holomorphic-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holomorphic-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify refactored runtime boundaries
        run: |
          grep -Fq '#define HOLOMORPHIC_WALK_WORKER_COUNT 3' android/app/src/main/cpp/holomorphic_walk.h
          grep -Fq '#define HOLOMORPHIC_WALK_DEFAULT_COEFFICIENT_BUDGET 1.20f' android/app/src/main/cpp/holomorphic_walk.h
          grep -Fq '#define SEARCH_CANDIDATES 128' android/app/src/main/cpp/holomorphic_walk.c
          grep -Fq 'holomorphic_walk_best_direction' android/app/src/main/cpp/field_evolution.c
          grep -Fq 'field->coefficient_budget' android/app/src/main/cpp/field_evolution.c
          grep -Fq 'FIELD_BACKGROUND_WANDERING_OFFSCREEN_POLES' android/app/src/main/cpp/field_evolution.h
          grep -Fq 'motion_program_advance' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'scenario_parse_text' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'SCENE_FACTOR_POLE' android/app/src/main/cpp/scene.h
          grep -Fq '#define REMOTE_POLE_COUNT 24' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_remote_poles_enabled' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_show_controls' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_marker_radius' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'vec3 color = wegert_color_from_phase_log_modulus(phase, log_modulus);' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'presentation=interactive' android/app/src/main/assets/scenario.conf
          grep -Fq 'field=wandering_offscreen_poles' scenarios/video-demo.conf
          grep -Fq 'field_budget=6.0' scenarios/video-demo.conf
          grep -Fq 'clean presentation system UI hidden' android/app/src/main/java/org/isomorphisms/analyticcontinuation/ExplorerActivity.java
          ! grep -Fq 'u_paused' android/app/src/main/assets/continuation.frag.in
          test ! -e android/app/src/main/cpp/analytic_continuation.c
          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in

      - name: Test direction search on host
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_holomorphic_walk.c \
            android/app/src/main/cpp/holomorphic_walk.c \
            -pthread -lm \
            -o /tmp/test-holomorphic-walk
          /tmp/test-holomorphic-walk

      - name: Test scene, scenario, presentation and motion on host
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_scene_motion.c \
            android/app/src/main/cpp/scene.c \
            android/app/src/main/cpp/motion.c \
            android/app/src/main/cpp/presentation.c \
            android/app/src/main/cpp/scenario.c \
            -lm \
            -o /tmp/test-scene-motion
          /tmp/test-scene-motion

      - name: Build normal interactive APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify stable sideload signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-signing.txt
          grep -Fqi '27eee69b1cbeebc30eab35fe7eb5459c542784b4ccc68453a372cb6802ccf7cf' /tmp/apk-signing.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-holomorphic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build clean data-driven video scenario APK
        run: |
          cp scenarios/video-demo.conf android/app/src/main/assets/scenario.conf
          cd android
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/video-demo-app-debug.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-video-demo-apk
          path: ${{ runner.temp }}/video-demo-app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-holomorphic-apk
          path: artifacts

      - name: Install screenshot comparison support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch moving soup and exercise zero and pole editing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: bash ci/emulate_interactive.sh artifacts/app-debug.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-holomorphic-emulator-evidence
          path: |
            holomorphic-emulator.log
            holomorphic-emulator.png
            holomorphic-motion-a.png
            holomorphic-motion-b.png
          if-no-files-found: warn

  emulate-video-demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-video-demo-apk
          path: artifacts

      - name: Install screenshot comparison support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run clean off-screen-pole soup and scheduled exchanges
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: bash ci/emulate_video_demo.sh artifacts/video-demo-app-debug.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-video-demo-emulator-evidence
          path: |
            video-demo.log
            video-demo-a.png
            video-demo-b.png
          if-no-files-found: warn
