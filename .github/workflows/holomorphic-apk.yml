name: Holomorphic Random Explorer APK

on:
  push:
    branches:
      - refactor
    paths:
      - 'android/**'
      - 'scenarios/**'
      - 'tests/test_holomorphic_walk.c'
      - 'tests/test_scene_motion.c'
      - '.github/workflows/holomorphic-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'scenarios/**'
      - 'tests/test_holomorphic_walk.c'
      - 'tests/test_scene_motion.c'
      - '.github/workflows/holomorphic-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holomorphic-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify refactored holomorphic architecture
        run: |
          grep -Fq '#define HOLOMORPHIC_WALK_WORKER_COUNT 3' android/app/src/main/cpp/holomorphic_walk.h
          grep -Fq '#define HOLOMORPHIC_WALK_DEFAULT_COEFFICIENT_BUDGET 1.20f' android/app/src/main/cpp/holomorphic_walk.h
          grep -Fq '#define SEARCH_CANDIDATES 128' android/app/src/main/cpp/holomorphic_walk.c
          grep -Fq 'Re(delta_q) and Im(delta_q) are log-modulus/phase sensitivities' android/app/src/main/cpp/holomorphic_walk.c
          grep -Fq 'holomorphic_walk_best_direction' android/app/src/main/cpp/field_evolution.c
          grep -Fq 'field->speed * direction' android/app/src/main/cpp/field_evolution.c
          grep -Fq 'field->coefficient_budget' android/app/src/main/cpp/field_evolution.c
          grep -Fq 'FIELD_BACKGROUND_WANDERING_OFFSCREEN_POLES' android/app/src/main/cpp/field_evolution.h
          grep -Fq 'motion_program_advance' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'scenario_parse_text' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'APP_CMD_LOST_FOCUS' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'SCENE_FACTOR_POLE' android/app/src/main/cpp/scene.h
          grep -Fq '#define REMOTE_POLE_COUNT 24' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_remote_poles_enabled' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_holomorphic_coefficients' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_show_controls' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'u_marker_radius' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'vec2 u = z / 3.0;' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'log_modulus += q.x;' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'phase += q.y;' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'vec3 color = wegert_color_from_phase_log_modulus(phase, log_modulus);' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'presentation=interactive' android/app/src/main/assets/scenario.conf
          grep -Fq 'field=wandering_offscreen_poles' scenarios/video-demo.conf
          grep -Fq 'field_budget=6.0' scenarios/video-demo.conf
          ! grep -Fq 'u_paused' android/app/src/main/assets/continuation.frag.in
          test ! -e android/app/src/main/cpp/analytic_continuation.c
          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in

      - name: Test direction search on host
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_holomorphic_walk.c \
            android/app/src/main/cpp/holomorphic_walk.c \
            -pthread -lm \
            -o /tmp/test-holomorphic-walk
          /tmp/test-holomorphic-walk

      - name: Test scenario and motion modules on host
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tests/test_scene_motion.c \
            android/app/src/main/cpp/scene.c \
            android/app/src/main/cpp/motion.c \
            android/app/src/main/cpp/presentation.c \
            android/app/src/main/cpp/scenario.c \
            -lm \
            -o /tmp/test-scene-motion
          /tmp/test-scene-motion

      - name: Build normal interactive APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify stable sideload signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-signing.txt
          grep -Fqi '27eee69b1cbeebc30eab35fe7eb5459c542784b4ccc68453a372cb6802ccf7cf' /tmp/apk-signing.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-holomorphic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build clean data-driven video scenario APK
        run: |
          cp scenarios/video-demo.conf android/app/src/main/assets/scenario.conf
          cd android
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/video-demo-app-debug.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-video-demo-apk
          path: ${{ runner.temp }}/video-demo-app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-holomorphic-apk
          path: artifacts

      - name: Install screenshot comparison support
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch moving soup and exercise zero and pole editing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 4
            adb logcat -d > holomorphic-emulator.log
            grep -Fq 'scenario ready: name=interactive' holomorphic-emulator.log
            grep -Fq 'holomorphic field started with 3 workers' holomorphic-emulator.log
            grep -Fq 'holomorphic field ready:' holomorphic-emulator.log
            grep -Fq 'zeros=1 poles=1' holomorphic-emulator.log
            grep -Fq 'holomorphic field first frame:' holomorphic-emulator.log
            steps_before=$(sed -n 's/.*holomorphic field: workers=3 steps=\([0-9][0-9]*\).*/\1/p' holomorphic-emulator.log | tail -1); test -n "$steps_before"; test "$steps_before" -gt 0; printf '%s\n' "$steps_before" > /tmp/holomorphic-steps-before

            adb exec-out screencap -p > holomorphic-motion-a.png
            sleep 6
            adb exec-out screencap -p > holomorphic-motion-b.png
            adb logcat -d > holomorphic-emulator.log
            steps_after_motion=$(sed -n 's/.*holomorphic field: workers=3 steps=\([0-9][0-9]*\).*/\1/p' holomorphic-emulator.log | tail -1); steps_before=$(cat /tmp/holomorphic-steps-before); test -n "$steps_after_motion"; test "$steps_after_motion" -gt "$steps_before"; printf '%s\n' "$steps_after_motion" > /tmp/holomorphic-steps-after-motion
            python3 - <<'PY'
            from PIL import Image, ImageChops, ImageStat

            first = Image.open('holomorphic-motion-a.png').convert('RGB')
            second = Image.open('holomorphic-motion-b.png').convert('RGB')
            if first.size != second.size:
                raise SystemExit('motion screenshots have different dimensions')

            width, height = first.size
            box = (
                int(width * 0.10),
                int(height * 0.15),
                int(width * 0.90),
                int(height * 0.85),
            )
            diff = ImageChops.difference(first.crop(box), second.crop(box))
            mean = sum(ImageStat.Stat(diff).mean) / 3.0
            pixels = list(diff.getdata())
            changed = sum(1 for pixel in pixels if max(pixel) >= 8)
            changed_fraction = changed / max(len(pixels), 1)
            print(f'holomorphic motion mean_abs_rgb={mean:.3f} changed_fraction={changed_fraction:.3f}')
            if mean < 1.5 or changed_fraction < 0.10:
                raise SystemExit('holomorphic motion is still too visually weak')
            PY

            set -- $(sed -n 's/.*holomorphic field ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' holomorphic-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; placement_radius=$((48 * min_side / 1000)); if [ "$placement_radius" -lt 26 ]; then placement_radius=26; fi; if [ "$placement_radius" -gt 38 ]; then placement_radius=38; fi; zero_control_x=$((placement_radius + 16)); control_y=$((height - placement_radius - 16)); pole_control_x=$((zero_control_x + 2 * placement_radius + 14)); adb shell input tap "$zero_control_x" "$control_y"; adb shell input tap "$((width / 2 - 100))" "$((height / 2 + 80))"; printf '%s %s %s %s\n' "$pole_control_x" "$control_y" "$width" "$height" > /tmp/holomorphic-placement-coordinates
            sleep 1
            read pole_control_x control_y width height < /tmp/holomorphic-placement-coordinates; adb shell input tap "$pole_control_x" "$control_y"; adb shell input tap "$((width / 2 + 120))" "$((height / 2 - 70))"
            sleep 2
            adb logcat -d > holomorphic-emulator.log
            grep -Fq 'placement selected: pole' holomorphic-emulator.log
            grep -Eq 'zero added: .*count=2' holomorphic-emulator.log
            grep -Eq 'pole added: .*count=2' holomorphic-emulator.log
            steps_after_edit=$(sed -n 's/.*holomorphic field: workers=3 steps=\([0-9][0-9]*\).*/\1/p' holomorphic-emulator.log | tail -1); steps_after_motion=$(cat /tmp/holomorphic-steps-after-motion); test -n "$steps_after_edit"; test "$steps_after_edit" -gt "$steps_after_motion"
            grep -Eq 'holomorphic field: workers=3 steps=[0-9]+ .*zeros=2 poles=2' holomorphic-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|holomorphic field shader uniforms unavailable|FATAL EXCEPTION' holomorphic-emulator.log
            adb exec-out screencap -p > holomorphic-emulator.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-holomorphic-emulator-evidence
          path: |
            holomorphic-emulator.log
            holomorphic-emulator.png
            holomorphic-motion-a.png
            holomorphic-motion-b.png
          if-no-files-found: warn

  emulate-video-demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-video-demo-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run clean off-screen-pole soup and scheduled exchanges
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size 270x480
            adb shell wm density 160
            adb install -r artifacts/video-demo-app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 4
            adb logcat -d > video-demo.log
            grep -Eq 'scenario ready: name=video-demo .*motion=1 controls=0 marker=5/1.8 field=1 .*field_budget=6' video-demo.log
            grep -Fq 'holomorphic field started with 3 workers' video-demo.log
            grep -Fq 'zeros=4 poles=4' video-demo.log
            adb exec-out screencap -p > video-demo-a.png
            sleep 22
            adb exec-out screencap -p > video-demo-b.png
            adb logcat -d > video-demo.log
            grep -Fq 'scenario=video-demo' video-demo.log
            grep -Fq 'exchanges=2/2' video-demo.log
            grep -Eq 'remote_t=[1-9][0-9]*\.|remote_t=[1-9]\.' video-demo.log
            adb shell pidof -s org.isomorphisms.analyticcontinuation.lasso.dev | tr -d '\r' | grep -Eq '^[0-9]+$'
            if cmp -s video-demo-a.png video-demo-b.png; then echo 'video demo did not move'; exit 1; fi
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|holomorphic field shader uniforms unavailable|FATAL EXCEPTION' video-demo.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-video-demo-emulator-evidence
          path: |
            video-demo.log
            video-demo-a.png
            video-demo-b.png
          if-no-files-found: warn
