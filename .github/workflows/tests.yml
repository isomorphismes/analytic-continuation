name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Wegert coloring oracle
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: main
          path: .wegert-upstream
          persist-credentials: false
      - name: Reject cross-repository coloring drift
        run: >-
          cmp
          android/app/src/main/assets/wegert_color.glsl
          .wegert-upstream/code/wegert_color.glsl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Reject retired CPU walk and migrated Lacunary machinery
        run: |
          test ! -e android/app/src/main/cpp/analytic_continuation.c
          test ! -e android/app/src/main/cpp/holomorphic_walk.c
          test ! -e android/app/src/main/cpp/holomorphic_walk.h
          ! grep -RniE 'holomorphic_walk|u_holomorphic_coefficients|deformation_velocity|deformation_accepted_steps' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in
          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in
