name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Wegert coloring oracle
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/wegert
          ref: main
          path: .wegert-upstream
          persist-credentials: false
      - name: Reject cross-repository coloring drift
        run: >-
          cmp
          android/app/src/main/assets/wegert_color.glsl
          .wegert-upstream/wegert_color.glsl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Check GPU-wide holomorphic flow invariants
        run: |
          shader=android/app/src/main/assets/continuation.frag.in
          native=android/app/src/main/cpp/analytic_continuation_random.c
          build=android/app/src/main/cpp/CMakeLists.txt
          grep -Fq 'uniform float u_flow_time;' "$shader"
          grep -Fq 'vec2 flowing_descriptor' "$shader"
          grep -Fq 'quadratic_coefficient' "$shader"
          grep -Fq 'flow_log_multiplier.x' "$shader"
          grep -Fq 'flow_log_multiplier.y' "$shader"
          grep -Fq 'engine->flow_time += dt;' "$native"
          grep -Fq 'CPU publishes only time' "$native"
          ! grep -Fq 'holomorphic_walk_' "$native"
          ! grep -Fq 'holomorphic_walk.c' "$build"
