name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Test perturbation worker pool
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            tests/test_perturbation_workers.c \
            android/app/src/main/cpp/perturbation_workers.c \
            -pthread -lm -o /tmp/test-perturbation-workers
          /tmp/test-perturbation-workers
