name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Wegert coloring oracle
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/wegert
          ref: main
          path: .wegert-upstream
          persist-credentials: false
      - name: Reject cross-repository coloring drift
        run: >-
          cmp
          android/app/src/main/assets/wegert_color.glsl
          .wegert-upstream/wegert_color.glsl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
