name: Bootstrap PowerVR phone fast path

on:
  push:
    branches:
      - experiment/powervr-phone-fastpath-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[powervr-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Move invariant remote-pole work off the fragment hot path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          shader_path = Path('android/app/src/main/assets/continuation.frag.in')
          shader = shader_path.read_text()
          shader = replace_once(
              shader,
              'uniform float u_remote_pole_time;\n',
              'uniform vec2 u_remote_pole_positions[REMOTE_POLE_COUNT];\n',
              'remote-pole uniform',
          )
          helper_start = shader.index('float hash1(float x) {')
          helper_end = shader.index('float circle_mask(', helper_start)
          shader = shader[:helper_start] + shader[helper_end:]
          remote_start = shader.index('    // Twenty-four additional X singularities')
          remote_end = shader.index('    // H(z)', remote_start)
          remote_block = '''    // Twenty-four remote poles are positioned once per frame on the CPU.\n    // Their combined meromorphic contribution is evaluated as one complex\n    // product, replacing 24 per-pixel atan/log pairs with one phase/modulus\n    // extraction while preserving the same product of pole factors.\n    vec2 remote_product = vec2(1.0, 0.0);\n    for (int index = 0; index < REMOTE_POLE_COUNT; ++index) {\n        vec2 delta = z - u_remote_pole_positions[index];\n        remote_product = complex_multiply(remote_product, delta);\n    }\n    float remote_scale = max(\n        max(abs(remote_product.x), abs(remote_product.y)),\n        1.0e-20\n    );\n    vec2 remote_normalized = remote_product / remote_scale;\n    phase -= atan(remote_product.y, remote_product.x);\n    log_modulus -= log(remote_scale)\n        + 0.5 * log(max(dot(remote_normalized, remote_normalized), 1.0e-16));\n\n'''
          shader = shader[:remote_start] + remote_block + shader[remote_end:]
          shader_path.write_text(shader)

          c_path = Path('android/app/src/main/cpp/analytic_continuation_random.c')
          source = c_path.read_text()
          source = replace_once(
              source,
              '#define MAX_FACTORS 32\n',
              '#define MAX_FACTORS 32\n#define REMOTE_POLE_COUNT 24\n',
              'remote-pole count',
          )
          source = replace_once(
              source,
              '    GLint remote_pole_time_location;\n',
              '    GLint remote_pole_positions_location;\n',
              'remote-pole location field',
          )
          source = replace_once(
              source,
              '    engine->remote_pole_time_location = glGetUniformLocation(\n        engine->program, "u_remote_pole_time"\n    );\n',
              '    engine->remote_pole_positions_location = glGetUniformLocation(\n        engine->program, "u_remote_pole_positions[0]"\n    );\n',
              'remote-pole uniform lookup',
          )
          source = replace_once(
              source,
              '        engine->remote_pole_time_location < 0 ||\n',
              '        engine->remote_pole_positions_location < 0 ||\n',
              'remote-pole uniform check',
          )
          renderer_log = '''    LOGI(\n        "holomorphic field renderer ready: GL_VERSION=%s GL_RENDERER=%s",\n        glGetString(GL_VERSION), glGetString(GL_RENDERER)\n    );\n'''
          source = replace_once(
              source,
              renderer_log,
              renderer_log + '    LOGI("remote pole path: CPU positions + collapsed fragment product");\n',
              'renderer fast-path log',
          )

          insertion = source.index('static void draw_frame(struct engine *engine) {')
          helper = r'''static float remote_pole_hash(float x) {
    float value = sinf(x * 127.1f + 31.7f) * 43758.5453123f;
    return value - floorf(value);
}

static void remote_pole_positions_for_frame(
    const struct engine *engine,
    float positions[REMOTE_POLE_COUNT][2]
) {
    const float tau = 6.2831853f;
    float pixel_radius = view_pixel_radius(engine);
    float view_outer_radius = hypotf(
        0.5f * (float)engine->width,
        0.5f * (float)engine->height
    ) / pixel_radius;

    for (int index = 0; index < REMOTE_POLE_COUNT; ++index) {
        float k = (float)index;
        float initial_angle = tau * remote_pole_hash(k + 0.11f);
        float radius_scale = 2.75f
            + 1.25f * remote_pole_hash(k + 1.73f);
        float speed = 0.11f
            + 0.08f * remote_pole_hash(k + 4.37f);
        float handedness = remote_pole_hash(k + 7.91f) < 0.5f ? -1.0f : 1.0f;
        float angle = initial_angle
            + handedness * speed * engine->remote_pole_time;
        float bend_phase = tau * remote_pole_hash(k + 11.23f);
        float radius = radius_scale
            + 0.22f * sinf(2.0f * angle + bend_phase);
        float ellipticity = -0.08f
            + 0.16f * remote_pole_hash(k + 14.67f);

        positions[index][0] = view_outer_radius * radius
            * (1.0f + ellipticity) * cosf(angle);
        positions[index][1] = view_outer_radius * radius
            * (1.0f - ellipticity) * sinf(angle);
    }
}

'''
          source = source[:insertion] + helper + source[insertion:]
          source = replace_once(
              source,
              '    glUniform1f(engine->remote_pole_time_location, engine->remote_pole_time);\n',
              '    float remote_pole_positions[REMOTE_POLE_COUNT][2];\n'
              '    remote_pole_positions_for_frame(engine, remote_pole_positions);\n'
              '    glUniform2fv(\n'
              '        engine->remote_pole_positions_location,\n'
              '        REMOTE_POLE_COUNT,\n'
              '        &remote_pole_positions[0][0]\n'
              '    );\n',
              'remote-pole upload',
          )
          c_path.write_text(source)
          PY

          git diff --check
          grep -Fq 'uniform vec2 u_remote_pole_positions[REMOTE_POLE_COUNT];' android/app/src/main/assets/continuation.frag.in
          ! grep -Fq 'u_remote_pole_time' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'remote pole path: CPU positions + collapsed fragment product' android/app/src/main/cpp/analytic_continuation_random.c
          git config user.name i
          git config user.email isomorphisms@sdf.org
          git add android/app/src/main/assets/continuation.frag.in android/app/src/main/cpp/analytic_continuation_random.c
          git commit -m 'Add PowerVR phone fast path [powervr-patched]'
          git push origin HEAD:experiment/powervr-phone-fastpath-bootstrap
