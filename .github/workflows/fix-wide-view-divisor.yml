name: Fix wide-view divisor rendering

on:
  push:
    branches:
      - experiment/powervr-phone-fastpath

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wide-view-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Apply wide-view fix
        run: python3 _/fix_wide_view_divisor.py

      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Fq 'view_outer_radius * radius' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'world_outer_radius * radius' android/app/src/main/cpp/analytic_continuation_random.c
          grep -Fq 'q.y - WEGERT_TAU * floor(q.y / WEGERT_TAU)' android/app/src/main/assets/continuation.frag.in
          ! grep -Fq 'phase += q.y' android/app/src/main/assets/continuation.frag.in
          grep -Fq 'Remote poles are persistent mathematical poles.' android/app/src/main/assets/continuation.frag.in
          git config user.name i
          git config user.email isomorphisms@sdf.org
          git add android/app/src/main/cpp/analytic_continuation_random.c android/app/src/main/assets/continuation.frag.in
          git commit -m 'Preserve divisor structure at wide zoom [wide-view-fixed]'
          git push origin HEAD:experiment/powervr-phone-fastpath
