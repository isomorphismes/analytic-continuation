name: Pinch zoom and zoomed drag

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/pinch-zoom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinch-zoom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build debug APK with touch self-test path
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pinch live activity and drag zero at zoomed scale
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            app=android/app/build/outputs/apk/debug/app-debug.apk
            test -s "$app"
            adb install -r "$app"
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W \
              -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity \
              --ez ci_touch_self_test true
            sleep 5
            adb logcat -d > pinch-emulator.log
            grep -Fq 'ci touch self-test: surface=' pinch-emulator.log
            grep -Fq 'lasso zoom: 2.250' pinch-emulator.log
            grep -Fq 'factor drag selected: zero index=0' pinch-emulator.log
            grep -Fq 'zero moved: index=0' pinch-emulator.log
            ! grep -Eiq 'FATAL EXCEPTION|shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|lasso shader uniforms unavailable' pinch-emulator.log
            adb exec-out screencap -p > pinch-emulator.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytic-continuation-pinch-evidence
          path: |
            pinch-emulator.log
            pinch-emulator.png
          if-no-files-found: warn
