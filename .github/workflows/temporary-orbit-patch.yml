name: Temporary smooth orbit patch

on:
  push:
    branches:
      - experiment/wandering-offscreen-poles
    paths:
      - '.github/workflows/temporary-orbit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/wandering-offscreen-poles
          fetch-depth: 0

      - name: Replace Brownian pole steering with smooth orbits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          host_path = Path('android/app/src/main/cpp/analytic_continuation_random.c')
          host = host_path.read_text()

          replacements = [
              (
                  '    GLint holomorphic_coefficients_location;\n    GLint zoom_location;',
                  '    GLint holomorphic_coefficients_location;\n    GLint remote_pole_time_location;\n    GLint zoom_location;',
              ),
              (
                  '    float holomorphic_coefficients[HOLOMORPHIC_WALK_COEFFICIENT_COUNT][2];\n    float deformation_velocity[HOLOMORPHIC_WALK_COEFFICIENT_COUNT][2];',
                  '    float holomorphic_coefficients[HOLOMORPHIC_WALK_COEFFICIENT_COUNT][2];\n    float deformation_velocity[HOLOMORPHIC_WALK_COEFFICIENT_COUNT][2];\n    float remote_pole_time;',
              ),
              (
                  '    memset(engine->deformation_velocity, 0, sizeof(engine->deformation_velocity));\n    engine->deformation_last_time = monotonic_seconds();',
                  '    memset(engine->deformation_velocity, 0, sizeof(engine->deformation_velocity));\n    engine->remote_pole_time = 0.0f;\n    engine->deformation_last_time = monotonic_seconds();',
              ),
              (
                  '    engine->holomorphic_coefficients_location = glGetUniformLocation(\n        engine->program, "u_holomorphic_coefficients[0]"\n    );\n    engine->zoom_location = glGetUniformLocation(engine->program, "u_zoom");',
                  '    engine->holomorphic_coefficients_location = glGetUniformLocation(\n        engine->program, "u_holomorphic_coefficients[0]"\n    );\n    engine->remote_pole_time_location = glGetUniformLocation(\n        engine->program, "u_remote_pole_time"\n    );\n    engine->zoom_location = glGetUniformLocation(engine->program, "u_zoom");',
              ),
              (
                  '        engine->holomorphic_coefficients_location < 0 ||\n        engine->zoom_location < 0 || engine->placement_kind_location < 0',
                  '        engine->holomorphic_coefficients_location < 0 ||\n        engine->remote_pole_time_location < 0 ||\n        engine->zoom_location < 0 || engine->placement_kind_location < 0',
              ),
              (
                  '        &engine->holomorphic_coefficients[0][0]\n    );\n    glUniform1f(engine->zoom_location, engine->zoom);',
                  '        &engine->holomorphic_coefficients[0][0]\n    );\n    glUniform1f(engine->remote_pole_time_location, engine->remote_pole_time);\n    glUniform1f(engine->zoom_location, engine->zoom);',
              ),
              (
                  '    if (!engine->focused || engine->dragging_factor || engine->pinching) {\n        return;\n    }\n',
                  '    if (!engine->focused || engine->dragging_factor || engine->pinching) {\n        return;\n    }\n\n    engine->remote_pole_time += dt;\n    engine->dirty = true;\n',
              ),
          ]

          for old, new in replacements:
              count = host.count(old)
              if count != 1:
                  raise SystemExit(f'host replacement expected once, found {count}: {old[:80]!r}')
              host = host.replace(old, new, 1)
          host_path.write_text(host)

          shader_path = Path('android/app/src/main/assets/continuation.frag.in')
          shader = shader_path.read_text()
          old_uniform = 'uniform vec2 u_holomorphic_coefficients[HOLOMORPHIC_COEFFICIENT_COUNT];\nuniform float u_zoom;'
          new_uniform = 'uniform vec2 u_holomorphic_coefficients[HOLOMORPHIC_COEFFICIENT_COUNT];\nuniform float u_remote_pole_time;\nuniform float u_zoom;'
          if shader.count(old_uniform) != 1:
              raise SystemExit('shader uniform insertion point not unique')
          shader = shader.replace(old_uniform, new_uniform, 1)

          start = shader.index('vec2 remote_pole_direction(int index) {')
          end = shader.index('\nfloat circle_mask(', start)
          orbit_code = (
              'vec2 remote_pole_direction(int index) {\n'
              '    float k = float(index);\n'
              '    float angle = 6.2831853 * hash1(k + 0.11);\n'
              '    return vec2(cos(angle), sin(angle));\n'
              '}\n\n'
              'float remote_pole_radius_scale(int index) {\n'
              '    float k = float(index);\n'
              '    return mix(2.75, 4.00, hash1(k + 1.73));\n'
              '}\n\n'
              'float remote_pole_orbit_speed(int index) {\n'
              '    float k = float(index);\n'
              '    return mix(0.11, 0.19, hash1(k + 4.37));\n'
              '}\n\n'
              'float remote_pole_handedness(int index) {\n'
              '    float k = float(index);\n'
              '    return hash1(k + 7.91) < 0.5 ? -1.0 : 1.0;\n'
              '}\n\n'
              'vec2 remote_pole_position(int index, float view_outer_radius) {\n'
              '    float k = float(index);\n'
              '    vec2 initial_direction = remote_pole_direction(index);\n'
              '    float initial_angle = atan(initial_direction.y, initial_direction.x);\n'
              '    float angle = initial_angle\n'
              '        + remote_pole_handedness(index) * remote_pole_orbit_speed(index) * u_remote_pole_time;\n\n'
              '    float bend_phase = 6.2831853 * hash1(k + 11.23);\n'
              '    float radial_bend = 0.22 * sin(2.0 * angle + bend_phase);\n'
              '    float radius = remote_pole_radius_scale(index) + radial_bend;\n\n'
              '    float ellipticity = mix(-0.08, 0.08, hash1(k + 14.67));\n'
              '    vec2 orbit = vec2(\n'
              '        (1.0 + ellipticity) * cos(angle),\n'
              '        (1.0 - ellipticity) * sin(angle)\n'
              '    );\n\n'
              '    return view_outer_radius * radius * orbit;\n'
              '}\n'
          )
          shader = shader[:start] + orbit_code + shader[end:]
          shader = shader.replace(
              '// Eight additional X singularities are kept well outside the circumscribed',
              '// Twenty-four additional X singularities stay well outside the circumscribed',
              1,
          )
          shader_path.write_text(shader)
          PY

          rm .github/workflows/temporary-orbit-patch.yml

          git config user.name 'orbit-patch'
          git config user.email 'orbit-patch@users.noreply.github.com'
          git add android/app/src/main/cpp/analytic_continuation_random.c \
                  android/app/src/main/assets/continuation.frag.in \
                  .github/workflows/temporary-orbit-patch.yml
          git diff --cached --check
          git commit -m 'Give remote poles smooth orbital paths'
          git push origin HEAD:experiment/wandering-offscreen-poles
