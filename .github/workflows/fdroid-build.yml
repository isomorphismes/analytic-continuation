name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - 'android/**'
      - 'fdroid/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Remove non-F-Droid signing input
        run: rm -f android/app/debug/lasso-dev.p12.b64

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify F-Droid release output
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/analytic-release-files.txt"
          grep -Fxq lib/arm64-v8a/libanalytic_continuation.so "$RUNNER_TEMP/analytic-release-files.txt"
          grep -Fxq lib/armeabi-v7a/libanalytic_continuation.so "$RUNNER_TEMP/analytic-release-files.txt"
          grep -Fxq lib/x86_64/libanalytic_continuation.so "$RUNNER_TEMP/analytic-release-files.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/analytic-release-badging.txt"
          grep -Fq "package: name='org.isomorphisms.analyticcontinuation' versionCode='4' versionName='0.2.2'" "$RUNNER_TEMP/analytic-release-badging.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: analytic-continuation-fdroid-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  emulate-release-payload:
    needs: release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install APK signing tools
        run: sdkmanager "platform-tools" "build-tools;36.0.0"

      - uses: actions/download-artifact@v4
        with:
          name: analytic-continuation-fdroid-unsigned
          path: artifacts

      - name: Sign an ephemeral copy of the exact release payload
        run: |
          unsigned=artifacts/app-release-unsigned.apk
          runtime=artifacts/app-release-runtime-test.apk
          test -s "$unsigned"
          cp "$unsigned" "$runtime"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/runtime-test.jks" \
            -storepass android \
            -keypass android \
            -alias runtime-test \
            -dname 'CN=F-Droid runtime CI' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/runtime-test.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$runtime"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$runtime"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the exact release payload
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-release-runtime-test.apk
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 4
            adb logcat -d > fdroid-release-emulator.log
            grep -Fq 'holomorphic walk started with 3 workers' fdroid-release-emulator.log
            grep -Fq 'lasso ready:' fdroid-release-emulator.log
            grep -Fq 'zeros=1 poles=1 placement=zero' fdroid-release-emulator.log
            grep -Fq 'lasso first frame:' fdroid-release-emulator.log
            adb shell dumpsys package org.isomorphisms.analyticcontinuation > fdroid-release-package.txt
            grep -Fq 'versionCode=4' fdroid-release-package.txt
            grep -Fq 'versionName=0.2.2' fdroid-release-package.txt
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|lasso shader uniforms unavailable|FATAL EXCEPTION' fdroid-release-emulator.log
            adb exec-out screencap -p > fdroid-release-emulator.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytic-continuation-fdroid-runtime-evidence
          path: |
            artifacts/app-release-runtime-test.apk
            fdroid-release-emulator.log
            fdroid-release-package.txt
            fdroid-release-emulator.png
          if-no-files-found: warn
