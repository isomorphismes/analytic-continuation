name: Lasso branch CI

on:
  pull_request:
    branches:
      - lasso
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify pinch zoom wiring
        run: |
          grep -Fq 'engine->zoom' android/app/src/main/cpp/analytic_continuation.c
          grep -Fq 'u_zoom' android/app/src/main/assets/continuation.frag
          grep -Fq 'AMOTION_EVENT_ACTION_POINTER_DOWN' android/app/src/main/cpp/analytic_continuation.c

      - name: Build lasso APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-lasso-pinch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and exercise lasso controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 3
            adb logcat -d > lasso-branch-ci.log
            grep -Fq 'lasso ready:' lasso-branch-ci.log
            grep -Fq 'outside=domain-coloring' lasso-branch-ci.log
            grep -Fq 'lasso first frame:' lasso-branch-ci.log
            ! grep -Eiq 'shader compilation failed|program link failed|lasso shader uniforms unavailable' lasso-branch-ci.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-branch-ci.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; control_radius=$((52 * min_side / 1000)); if [ "$control_radius" -lt 28 ]; then control_radius=28; fi; if [ "$control_radius" -gt 42 ]; then control_radius=42; fi; adb shell input tap "$((control_radius + 16))" "$((control_radius + 16))"
            sleep 1
            adb logcat -d > lasso-branch-ci.log
            grep -Fq 'lasso phase walk paused' lasso-branch-ci.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-branch-ci.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; lasso_radius=$((42 * min_side / 100)); center_x=$((width / 2)); center_y=$((height / 2)); offset=$((707 * lasso_radius / 1000)); adb shell input swipe "$((center_x + offset))" "$((center_y - offset))" "$((center_x + offset + 50))" "$((center_y - offset - 50))" 500
            sleep 1
            adb logcat -d > lasso-branch-ci.log
            grep -Fq 'lasso deformed:' lasso-branch-ci.log
            grep -Fq 'lasso drag finished:' lasso-branch-ci.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-branch-ci.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; control_radius=$((52 * min_side / 1000)); if [ "$control_radius" -lt 28 ]; then control_radius=28; fi; if [ "$control_radius" -gt 42 ]; then control_radius=42; fi; adb shell input tap "$((width - 4 * control_radius - 16))" "$((control_radius + 16))"
            sleep 1
            adb logcat -d > lasso-branch-ci.log
            grep -Fq 'lasso close requested' lasso-branch-ci.log
            adb exec-out screencap -p > lasso-branch-ci.png || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lasso-branch-ci-evidence
          path: |
            lasso-branch-ci.log
            lasso-branch-ci.png
          if-no-files-found: warn
