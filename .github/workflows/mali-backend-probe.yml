name: Structured shader backend probe

on:
  push:
    branches:
      - properly-typed
  workflow_dispatch:

permissions:
  contents: read

env:
  IDRIS2_VERSION: 0.8.0
  COMPLEX_FOLLOWER_SHA: 4360f29d3bbdc09b4cc513e4a6be647f290ffede
  GENERIC_BACKEND_SHA: c8c55a6eb351e5a0196335e8b2cb3cf0f1fd4fb0
  MALI_BACKEND_SHA: efcdbc8fddbe897f98a11375cb565965dc471ceb

jobs:
  compile-current-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Analytic Continuation
        uses: actions/checkout@v4

      - name: Check out complex arithmetic follower
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/idris-shader-backend
          ref: ${{ env.COMPLEX_FOLLOWER_SHA }}
          path: .complex-follower
          persist-credentials: false

      - name: Check out generic structured backend
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/idris-shader-backend
          ref: ${{ env.GENERIC_BACKEND_SHA }}
          path: .generic-backend
          persist-credentials: false

      - name: Check out Mali-G57 optimization backend
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/idris-shader-backend
          ref: ${{ env.MALI_BACKEND_SHA }}
          path: .mali-backend
          persist-credentials: false

      - name: Overlay only the complex arithmetic follower
        run: |
          cp .complex-follower/src/Shader/ComplexProjectiveFollower.idr \
            .generic-backend/src/Shader/ComplexProjectiveFollower.idr
          cp .complex-follower/src/Shader/ComplexProjectiveFollower.idr \
            .mali-backend/src/Shader/ComplexProjectiveFollower.idr

      - name: Install compiler and GLSL validator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Restore Idris 2 compiler and API
        id: idris-cache
        uses: actions/cache@v4
        with:
          path: ~/.idris2
          key: properly-typed-idris2-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS2_VERSION }}-api-v1

      - name: Build Idris 2 if cache is empty
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C /tmp/Idris2 clean
          make -C /tmp/Idris2 all
          make -C /tmp/Idris2 install
          make -C /tmp/Idris2 install-api

      - name: Put Idris 2 on PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Build both shader compilers
        run: |
          make -C .generic-backend backend
          make -C .mali-backend backend

      - name: Compile the same live typed core four ways
        run: |
          mkdir -p \
            build/structured-probe/generic-highp \
            build/structured-probe/generic-lowp \
            build/structured-probe/mali-highp \
            build/structured-probe/mali-lowp

          cp gpu/Example/AnalyticContinuationHandwrittenCore.idr \
            .generic-backend/src/Example/AnalyticContinuationHandwrittenCore.idr
          cp gpu/Example/AnalyticContinuationHandwrittenCore.idr \
            .mali-backend/src/Example/AnalyticContinuationHandwrittenCore.idr

          .generic-backend/build/exec/idris2-glsles \
            --cg glsles \
            --directive dump-ir="$GITHUB_WORKSPACE/build/structured-probe/generic-highp/core.ir" \
            --directive float-precision=highp \
            --source-dir .generic-backend/src \
            --output-dir "$GITHUB_WORKSPACE/build/structured-probe/generic-highp" \
            .generic-backend/src/Example/AnalyticContinuationHandwrittenCore.idr \
            -o core

          .generic-backend/build/exec/idris2-glsles \
            --cg glsles \
            --directive dump-ir="$GITHUB_WORKSPACE/build/structured-probe/generic-lowp/core.ir" \
            --directive float-precision=lowp \
            --source-dir .generic-backend/src \
            --output-dir "$GITHUB_WORKSPACE/build/structured-probe/generic-lowp" \
            .generic-backend/src/Example/AnalyticContinuationHandwrittenCore.idr \
            -o core

          .mali-backend/build/exec/idris2-glsles \
            --cg glsles \
            --directive dump-ir="$GITHUB_WORKSPACE/build/structured-probe/mali-highp/core.ir" \
            --directive float-precision=highp \
            --source-dir .mali-backend/src \
            --output-dir "$GITHUB_WORKSPACE/build/structured-probe/mali-highp" \
            .mali-backend/src/Example/AnalyticContinuationHandwrittenCore.idr \
            -o core

          .mali-backend/build/exec/idris2-glsles \
            --cg glsles \
            --directive dump-ir="$GITHUB_WORKSPACE/build/structured-probe/mali-lowp/core.ir" \
            --directive float-precision=lowp \
            --source-dir .mali-backend/src \
            --output-dir "$GITHUB_WORKSPACE/build/structured-probe/mali-lowp" \
            .mali-backend/src/Example/AnalyticContinuationHandwrittenCore.idr \
            -o core

      - name: Validate and inspect emitted control flow
        run: |
          for shader in build/structured-probe/*/core.frag; do
            glslangValidator -S frag "$shader"
          done

          python3 - <<'PY'
          from pathlib import Path

          root = Path('build/structured-probe')
          names = ['generic-highp', 'generic-lowp', 'mali-highp', 'mali-lowp']
          rows = []
          for name in names:
              shader = (root / name / 'core.frag').read_text()
              ir = (root / name / 'core.ir').read_text()
              lines = shader.splitlines()
              rows.append({
                  'name': name,
                  'precision': (
                      'lowp' if 'precision lowp float;' in shader
                      else 'mediump' if 'precision mediump float;' in shader
                      else 'highp'
                  ),
                  'shader_bytes': len(shader.encode()),
                  'shader_lines': len(lines),
                  'ir_lines': len(ir.splitlines()),
                  'atan': shader.count('atan('),
                  'log': shader.count('log('),
                  'real_if': shader.count('  if ('),
                  'ternary': shader.count(' ? '),
                  'gated_atan': sum('atan(' in line and line.startswith('    ') for line in lines),
                  'gated_log': sum('log(' in line and line.startswith('    ') for line in lines),
              })

          report = [
              'STRUCTURED_SHADER_BACKEND_PROBE 3',
              'complex_follower=4360f29d3bbdc09b4cc513e4a6be647f290ffede',
              'generic_backend=c8c55a6eb351e5a0196335e8b2cb3cf0f1fd4fb0',
              'mali_backend=efcdbc8fddbe897f98a11375cb565965dc471ceb',
              '',
          ]
          for row in rows:
              report.append(' '.join(f'{key}={value}' for key, value in row.items()))

          report += ['', 'acceptance:']
          failed = False
          for row in rows:
              structured = row['real_if'] > 0 and row['gated_atan'] == row['atan'] and row['gated_log'] == row['log']
              report.append(('PASS' if structured else 'FAIL') + f" {row['name']}_expensive_factor_work_gated")
              failed |= not structured

          low_ok = all(
              row['precision'] == 'lowp'
              for row in rows
              if row['name'].endswith('lowp')
          )
          report.append(('PASS' if low_ok else 'FAIL') + ' explicit_lowp_emission')
          failed |= not low_ok

          generic_structure = rows[0]['real_if'] == rows[1]['real_if']
          mali_structure = rows[2]['real_if'] == rows[3]['real_if']
          report.append(('PASS' if generic_structure else 'FAIL') + ' generic_structure_independent_of_precision')
          report.append(('PASS' if mali_structure else 'FAIL') + ' mali_structure_independent_of_precision')
          failed |= not generic_structure or not mali_structure

          text = '\n'.join(report) + '\n'
          (root / 'report.txt').write_text(text)
          print(text, end='')
          if failed:
              raise SystemExit(1)
          PY

      - name: Retain structured backend probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-shader-backend-probe
          path: build/structured-probe
          if-no-files-found: error
