# Public Lasso Dev release publisher; changes to this file intentionally retrigger publication.
name: Publish Lasso Dev Public Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lasso-dev-public-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'release-triggers/lasso-dev-v0.1.1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lasso-dev-public-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current lasso head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: lasso

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify original HCL palette is retained
        run: |
          set -euo pipefail
          SHADER=android/app/src/main/assets/continuation.frag
          grep -Fq 'vec3 hcl_to_srgb' "$SHADER"
          grep -Fq 'vec3 color = hcl_to_srgb(hue_degrees, 45.0, lightness);' "$SHADER"
          grep -Fq 'float lightness = 66.0' "$SHADER"
          ! grep -Fq 'vec3 hue_rgb' "$SHADER"

      - name: Build Lasso Dev APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify install channel and Android signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='org.isomorphisms.analyticcontinuation.lasso.dev' versionCode='2' versionName='0.1.1-lasso-dev'" /tmp/badging.txt
          unzip -l "$APK" | grep -Eq 'res/(mipmap|drawable).*(ic_launcher|ic_lasso)'

      - name: Prepare release assets
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk analytic-continuation-lasso-dev.apk
          sha256sum analytic-continuation-lasso-dev.apk > analytic-continuation-lasso-dev.apk.sha256
          unzip -t analytic-continuation-lasso-dev.apk

      - name: Publish and verify public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=lasso-dev-v0.1.1
          LASSO_SHA=$(git rev-parse HEAD)
          RELEASE_TITLE='Lasso Dev v0.1.1'
          RELEASE_NOTES="Color-corrected public sideload build of the analytic-continuation lasso experiment from lasso commit ${LASSO_SHA}.

          Restores the original CIELUV/HCL domain-coloring palette while retaining the cheaper Blaschke phase/modulus accumulation. Package: org.isomorphisms.analyticcontinuation.lasso.dev. Android version code: 2.

          This APK uses the same permanent non-production sideload signing key as Lasso Dev v0.1.0, so it updates that installation in place."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$TAG" \
            analytic-continuation-lasso-dev.apk \
            analytic-continuation-lasso-dev.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$LASSO_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,publishedAt,targetCommitish,assets \
            > /tmp/lasso-dev-release.json

          jq -e --arg expected "$LASSO_SHA" '
            .isDraft == false and
            .isPrerelease == false and
            .tagName == "lasso-dev-v0.1.1" and
            .targetCommitish == $expected and
            ([.assets[].name] | index("analytic-continuation-lasso-dev.apk") != null) and
            ([.assets[].name] | index("analytic-continuation-lasso-dev.apk.sha256") != null)
          ' /tmp/lasso-dev-release.json
          cat /tmp/lasso-dev-release.json
