name: Lasso APK

on:
  push:
    branches:
      - lasso
    paths:
      - 'android/**'
      - '.github/workflows/lasso-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lasso-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build lasso APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-lasso-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-lasso-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch, add a zero, and pause the phase walk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 3
            adb logcat -d > lasso-emulator.log
            grep -Fq 'lasso ready:' lasso-emulator.log
            grep -Fq 'lasso first frame:' lasso-emulator.log
            width="$(awk -F'[=x ]' '/lasso ready: surface=/{ for (i=1;i<=NF;i++) if ($i ~ /^[0-9]+$/) { print $i; exit } }' lasso-emulator.log)"
            height="$(awk -F'[=x ]' '/lasso ready: surface=/{ n=0; for (i=1;i<=NF;i++) if ($i ~ /^[0-9]+$/) { n++; if (n==2) { print $i; exit } } }' lasso-emulator.log)"
            test -n "$width"
            test -n "$height"
            adb shell input tap "$((width / 2))" "$((height / 2))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'zero added:' lasso-emulator.log
            adb shell input tap 52 52
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'lasso phase walk paused' lasso-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|lasso shader uniforms unavailable' lasso-emulator.log
            adb exec-out screencap -p > lasso-emulator.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-lasso-emulator-evidence
          path: |
            lasso-emulator.log
            lasso-emulator.png
          if-no-files-found: warn
