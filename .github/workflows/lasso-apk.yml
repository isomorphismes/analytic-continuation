name: Holomorphic Random Explorer APK

on:
  push:
    branches:
      - lasso
    paths:
      - 'android/**'
      - '.github/workflows/lasso-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/lasso-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lasso-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify GPU-wide holomorphic flow is wired
        run: >-
          python tests/test_renderer_boundary.py
          RendererBoundaryTests.test_gpu_flow_source_invariants

      - name: Build holomorphic-random APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify launcher icon is packaged
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-files.txt
          grep -Eq 'res/(mipmap|drawable).*(ic_launcher|ic_lasso)' /tmp/apk-files.txt

      - name: Verify stable sideload signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-signing.txt
          grep -Fqi '27eee69b1cbeebc30eab35fe7eb5459c542784b4ccc68453a372cb6802ccf7cf' /tmp/apk-signing.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-lasso-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-lasso-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch, pause, and resume GPU flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 4
            adb logcat -d > lasso-emulator.log
            grep -Fq 'GPU-wide holomorphic flow enabled; CPU publishes only time' lasso-emulator.log
            grep -Fq 'lasso ready:' lasso-emulator.log
            grep -Fq 'zeros=1 poles=1 placement=zero' lasso-emulator.log
            grep -Fq 'outside=domain-coloring' lasso-emulator.log
            grep -Fq 'lasso first frame:' lasso-emulator.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; control_radius=$((52 * min_side / 1000)); if [ "$control_radius" -lt 28 ]; then control_radius=28; fi; if [ "$control_radius" -gt 42 ]; then control_radius=42; fi; adb shell input tap "$((control_radius + 16))" "$((control_radius + 16))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'holomorphic flow paused' lasso-emulator.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; control_radius=$((52 * min_side / 1000)); if [ "$control_radius" -lt 28 ]; then control_radius=28; fi; if [ "$control_radius" -gt 42 ]; then control_radius=42; fi; adb shell input tap "$((control_radius + 16))" "$((control_radius + 16))"
            sleep 3
            adb logcat -d > lasso-emulator.log
            grep -Fq 'holomorphic flow running' lasso-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|lasso shader uniforms unavailable|FATAL EXCEPTION' lasso-emulator.log
            adb exec-out screencap -p > lasso-emulator.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-lasso-emulator-evidence
          path: |
            lasso-emulator.log
            lasso-emulator.png
          if-no-files-found: warn
