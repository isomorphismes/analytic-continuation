name: Lasso APK

on:
  push:
    branches:
      - lasso
    paths:
      - 'android/**'
      - '.github/workflows/lasso-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/lasso-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lasso-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check out Grease source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: isomorphisms/grease
          ref: e963958976eaa80a2517bae3fd34b0e5115ffcbe
          path: .grease
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Verify intended lasso interaction is wired
        run: |
          grep -Fq 'engine->zero_count = 1;' android/app/src/main/cpp/analytic_continuation.c
          grep -Fq 'PLACEMENT_INFINITY' android/app/src/main/cpp/analytic_continuation.c
          grep -Fq 'engine->zoom' android/app/src/main/cpp/analytic_continuation.c
          grep -Fq 'AMOTION_EVENT_ACTION_POINTER_DOWN' android/app/src/main/cpp/analytic_continuation.c
          grep -Fq 'u_pole_count' android/app/src/main/assets/continuation.frag
          grep -Fq 'u_placement_kind' android/app/src/main/assets/continuation.frag
          grep -Fq 'u_zoom' android/app/src/main/assets/continuation.frag
          grep -Fq 'vec3 hcl_to_srgb' android/app/src/main/assets/continuation.frag
          grep -Fq 'vec3 color = hcl_to_srgb(hue_degrees, 45.0, lightness);' android/app/src/main/assets/continuation.frag
          ! grep -Fq 'close_control_contains' android/app/src/main/cpp/analytic_continuation.c
          ! grep -Fq 'close_center' android/app/src/main/assets/continuation.frag
          ! grep -Fq 'ANativeActivity_finish' android/app/src/main/cpp/analytic_continuation.c

      - name: Build lasso APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify launcher icon is packaged
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-files.txt
          grep -Eq 'res/(mipmap|drawable).*(ic_launcher|ic_lasso)' /tmp/apk-files.txt

      - name: Verify stable sideload signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-signing.txt
          grep -Fqi '27eee69b1cbeebc30eab35fe7eb5459c542784b4ccc68453a372cb6802ccf7cf' /tmp/apk-signing.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-lasso-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Grease source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: isomorphisms/grease
          ref: e963958976eaa80a2517bae3fd34b0e5115ffcbe
          path: .grease
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-lasso-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch, pause, deform, and place zero and infinity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation.lasso.dev/org.isomorphisms.analyticcontinuation.ExplorerActivity
            sleep 3
            adb logcat -d > lasso-emulator.log
            grep -Fq 'lasso ready:' lasso-emulator.log
            grep -Fq 'zeros=1 poles=0 placement=zero' lasso-emulator.log
            grep -Fq 'outside=domain-coloring' lasso-emulator.log
            grep -Fq 'lasso first frame:' lasso-emulator.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; control_radius=$((52 * min_side / 1000)); if [ "$control_radius" -lt 28 ]; then control_radius=28; fi; if [ "$control_radius" -gt 42 ]; then control_radius=42; fi; adb shell input tap "$((control_radius + 16))" "$((control_radius + 16))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'lasso phase walk paused' lasso-emulator.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; lasso_radius=$((42 * min_side / 100)); center_x=$((width / 2)); center_y=$((height / 2)); offset=$((707 * lasso_radius / 1000)); start_x=$((center_x + offset)); start_y=$((center_y - offset)); end_x=$((start_x + 50)); end_y=$((start_y - 50)); adb shell input swipe "$start_x" "$start_y" "$end_x" "$end_y" 500
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'lasso deformed:' lasso-emulator.log
            grep -Fq 'lasso drag finished:' lasso-emulator.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; placement_radius=$((48 * min_side / 1000)); if [ "$placement_radius" -lt 26 ]; then placement_radius=26; fi; if [ "$placement_radius" -gt 38 ]; then placement_radius=38; fi; adb shell input tap "$((placement_radius + 16))" "$((height - placement_radius - 16))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'placement selected: zero' lasso-emulator.log
            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; lasso_radius=$((42 * min_side / 100)); adb shell input tap "$((width / 2 + lasso_radius / 3))" "$((height / 2))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'zero added:' lasso-emulator.log
            grep -Fq 'count=2' lasso-emulator.log

            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; placement_radius=$((48 * min_side / 1000)); if [ "$placement_radius" -lt 26 ]; then placement_radius=26; fi; if [ "$placement_radius" -gt 38 ]; then placement_radius=38; fi; zero_x=$((placement_radius + 16)); infinity_x=$((zero_x + 2 * placement_radius + 14)); adb shell input tap "$infinity_x" "$((height - placement_radius - 16))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'placement selected: infinity' lasso-emulator.log
            set -- $(sed -n 's/.*lasso ready: surface=\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' lasso-emulator.log | tail -1); width=$1; height=$2; min_side=$width; if [ "$height" -lt "$width" ]; then min_side=$height; fi; lasso_radius=$((42 * min_side / 100)); adb shell input tap "$((width / 2))" "$((height / 2 + lasso_radius / 3))"
            sleep 1
            adb logcat -d > lasso-emulator.log
            grep -Fq 'infinity added:' lasso-emulator.log
            grep -Fq 'count=1' lasso-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|lasso shader uniforms unavailable' lasso-emulator.log
            adb exec-out screencap -p > lasso-emulator.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-lasso-emulator-evidence
          path: |
            lasso-emulator.log
            lasso-emulator.png
          if-no-files-found: warn
