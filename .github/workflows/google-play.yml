name: Android viewer and native convergence explorer

on:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/google-play.yml'
      - 'docs/google-play-release.md'
  workflow_dispatch:
    inputs:
      version_code:
        description: New, permanently increasing Play version code
        required: true
        type: string
      version_name:
        description: User-visible version, such as 0.1.0
        required: true
        type: string
      destination:
        description: Keep the bundle as an artifact for the first manual upload, or send it to internal testing
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - internal-track
      release_status:
        description: State of an internal-track release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-analytic-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Test convergence and touch state rules
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_continuation_path.c -lm -o /tmp/analytic-continuation-path-test
          /tmp/analytic-continuation-path-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_gesture_state.c -o /tmp/analytic-gesture-test
          /tmp/analytic-gesture-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_state.c -o /tmp/analytic-factor-test
          /tmp/analytic-factor-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_snap.c -lm -o /tmp/analytic-snap-test
          /tmp/analytic-snap-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_completion_state.c -lm -o /tmp/analytic-completion-test
          /tmp/analytic-completion-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_zero_one_symbol.c -lm -o /tmp/analytic-zero-one-symbol-test
          /tmp/analytic-zero-one-symbol-test

      - name: Create disposable validation key
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.p12 \
            -storetype PKCS12 \
            -storepass validation-only \
            -keypass validation-only \
            -alias validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Validation'

      - name: Build native APK and signed Play bundle
        working-directory: android
        env:
          PLAY_VERSION_CODE: '1'
          PLAY_VERSION_NAME: ci
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/ci-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: validation-only
          ANDROID_UPLOAD_KEY_ALIAS: validation
          ANDROID_UPLOAD_KEY_PASSWORD: validation-only
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-validation-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  emulate-native-explorer:
    if: github.event_name == 'pull_request'
    needs: validate-android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-native-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and exercise the dot-line completion UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -n org.isomorphisms.analyticcontinuation/.ExplorerActivity
            sleep 4
            adb logcat -d > analytic-continuation-emulator.log
            adb shell pidof -s org.isomorphisms.analyticcontinuation | tr -d '\r' | grep -Eq '^[0-9]+$'
            grep -Fq 'vibrating analytic completion dot-line renderer ready' analytic-continuation-emulator.log
            width="$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print dimensions[1] }' analytic-continuation-emulator.log)"
            height="$(awk '/EGL surface ready:/ { split($NF, dimensions, "x") } END { print dimensions[2] }' analytic-continuation-emulator.log)"
            test "$width" -gt 0
            test "$height" -gt 0
            adb shell input swipe "$((width * 35 / 100))" "$((height * 55 / 100))" "$((width * 65 / 100))" "$((height * 55 / 100))" 400
            sleep 1
            adb logcat -d > analytic-continuation-emulator.log
            grep -Fq 'completion zero-one symbol added:' analytic-continuation-emulator.log
            grep -Fq '; 2 constraints; motion scale' analytic-continuation-emulator.log
            adb shell input tap "$((width / 2))" "$((height * 35 / 100))"
            sleep 1
            adb logcat -d > analytic-continuation-emulator.log
            adb exec-out screencap -p > analytic-continuation-emulator.png
            grep -Fq 'completion point 3 locked' analytic-continuation-emulator.log
            grep -Fq '; motion scale' analytic-continuation-emulator.log
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|dot-line renderer unavailable' analytic-continuation-emulator.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: analytic-continuation-emulator-evidence
          path: |
            analytic-continuation-emulator.log
            analytic-continuation-emulator.png
          if-no-files-found: warn

  render-movies:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ManimGL requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev xvfb xauth libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install -e '.[movie]'

      - name: Render bundled movies
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ANALYTIC_CONTINUATION_SPEC="$GITHUB_WORKSPACE/examples/zeta_smoke.json" \
            xvfb-run -a manimgl \
              src/analytic_continuation/scene.py FunctionOpenClose \
              -w -l \
              --video_dir rendered \
              --file_name zeta-open-close
          ANALYTIC_CONTINUATION_SPEC="$GITHUB_WORKSPACE/examples/rational_disc_reveal_smoke.json" \
            xvfb-run -a manimgl \
              src/analytic_continuation/scene.py FunctionOpenClose \
              -w -l \
              --video_dir rendered \
              --file_name rational-disc-reveal
          mkdir -p play-movies
          find rendered -type f -name 'zeta-open-close.mp4' -exec cp '{}' play-movies/ \;
          find rendered -type f -name 'rational-disc-reveal.mp4' -exec cp '{}' play-movies/ \;
          test -s play-movies/zeta-open-close.mp4
          test -s play-movies/rational-disc-reveal.mp4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-movies
          path: play-movies/*.mp4
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: render-movies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-movies
          path: android/app/src/main/assets/movies

      - name: Restore private upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > /tmp/play-upload.p12

      - name: Build signed viewer and explorer bundle
        working-directory: android
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/play-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Save signed app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-${{ inputs.version_name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Require Google Play credential
        if: inputs.destination == 'internal-track'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$SERVICE_ACCOUNT_JSON"

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal-track'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.isomorphisms.analyticcontinuation
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: ${{ inputs.release_status }}
          releaseName: ${{ inputs.version_name }}
