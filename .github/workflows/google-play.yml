name: Android viewer and native convergence explorer

on:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/**'
      - '.github/workflows/google-play.yml'
      - 'docs/google-play-release.md'
  workflow_dispatch:
    inputs:
      version_code:
        description: New, permanently increasing Play version code
        required: true
        type: string
      version_name:
        description: User-visible version, such as 0.1.0
        required: true
        type: string
      destination:
        description: Keep the bundle as an artifact for the first manual upload, or send it to internal testing
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - internal-track
      release_status:
        description: State of an internal-track release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-analytic-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Test convergence and touch state rules
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_continuation_path.c -lm -o /tmp/analytic-continuation-path-test
          /tmp/analytic-continuation-path-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_gesture_state.c -o /tmp/analytic-gesture-test
          /tmp/analytic-gesture-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_state.c -o /tmp/analytic-factor-test
          /tmp/analytic-factor-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_factor_snap.c -lm -o /tmp/analytic-snap-test
          /tmp/analytic-snap-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_perturbation_workers.c android/app/src/main/cpp/perturbation_workers.c -pthread -lm -o /tmp/analytic-perturbation-workers-test
          /tmp/analytic-perturbation-workers-test

      - name: Create disposable validation key
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.p12 \
            -storetype PKCS12 \
            -storepass validation-only \
            -keypass validation-only \
            -alias validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI validation, OU=CI, O=Analytic Continuation, L=Test, ST=Test, C=US"

      - name: Build native Android debug APK
        env:
          ANALYTIC_RELEASE_KEYSTORE: /tmp/ci-upload.p12
          ANALYTIC_RELEASE_KEYSTORE_PASSWORD: validation-only
          ANALYTIC_RELEASE_KEY_ALIAS: validation
          ANALYTIC_RELEASE_KEY_PASSWORD: validation-only
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: analytic-continuation-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-play-bundle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANALYTIC_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/analytic-release.p12

      - name: Build signed Android App Bundle
        env:
          ANALYTIC_RELEASE_KEYSTORE: /tmp/analytic-release.p12
          ANALYTIC_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANALYTIC_RELEASE_KEYSTORE_PASSWORD }}
          ANALYTIC_RELEASE_KEY_ALIAS: ${{ secrets.ANALYTIC_RELEASE_KEY_ALIAS }}
          ANALYTIC_RELEASE_KEY_PASSWORD: ${{ secrets.ANALYTIC_RELEASE_KEY_PASSWORD }}
          ANALYTIC_VERSION_CODE: ${{ inputs.version_code }}
          ANALYTIC_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cd android
          ./gradlew --no-daemon :app:bundleRelease

      - name: Upload signed Android App Bundle artifact
        if: inputs.destination == 'artifact-only'
        uses: actions/upload-artifact@v4
        with:
          name: analytic-continuation-${{ inputs.version_name }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal-track'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.isomorphisms.analyticcontinuation
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: ${{ inputs.release_status }}
