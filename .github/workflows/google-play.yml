name: Google Play movie viewer

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/google-play.yml'
      - 'docs/google-play-release.md'
  workflow_dispatch:
    inputs:
      version_code:
        description: New, permanently increasing Play version code
        required: true
        type: string
      version_name:
        description: User-visible version, such as 0.1.0
        required: true
        type: string
      destination:
        description: Keep the bundle as an artifact for the first manual upload, or send it to internal testing
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - internal-track
      release_status:
        description: State of an internal-track release
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-analytic-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Create disposable validation key
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.p12 \
            -storetype PKCS12 \
            -storepass validation-only \
            -keypass validation-only \
            -alias validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Validation'

      - name: Build signed validation bundle
        working-directory: android
        env:
          PLAY_VERSION_CODE: '1'
          PLAY_VERSION_NAME: ci
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/ci-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: validation-only
          ANDROID_UPLOAD_KEY_ALIAS: validation
          ANDROID_UPLOAD_KEY_PASSWORD: validation-only
        run: ./gradlew --no-daemon :app:bundleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-validation-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  render-movies:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ManimGL requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev xvfb xauth libgl1-mesa-dri
          python -m pip install --upgrade pip
          python -m pip install -e '.[movie]'

      - name: Render bundled movies
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ANALYTIC_CONTINUATION_SPEC="$GITHUB_WORKSPACE/examples/zeta_smoke.json" \
            xvfb-run -a manimgl \
              src/analytic_continuation/scene.py FunctionOpenClose \
              -w -l \
              --video_dir rendered \
              --file_name zeta-open-close
          ANALYTIC_CONTINUATION_SPEC="$GITHUB_WORKSPACE/examples/rational_continuation_smoke.json" \
            xvfb-run -a manimgl \
              src/analytic_continuation/scene.py FunctionOpenClose \
              -w -l \
              --video_dir rendered \
              --file_name rational-continuation
          mkdir -p play-movies
          find rendered -type f -name 'zeta-open-close.mp4' -exec cp '{}' play-movies/ \;
          find rendered -type f -name 'rational-continuation.mp4' -exec cp '{}' play-movies/ \;
          test -s play-movies/zeta-open-close.mp4
          test -s play-movies/rational-continuation.mp4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-movies
          path: play-movies/*.mp4
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: render-movies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-play
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: analytic-continuation-movies
          path: android/app/src/main/assets/movies

      - name: Restore private upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > /tmp/play-upload.p12

      - name: Build signed movie-viewer bundle
        working-directory: android
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
          PLAY_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_UPLOAD_KEYSTORE_PATH: /tmp/play-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Save signed app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytic-continuation-${{ inputs.version_name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Require Google Play credential
        if: inputs.destination == 'internal-track'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$SERVICE_ACCOUNT_JSON"

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal-track'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.isomorphisms.analyticcontinuation
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: ${{ inputs.release_status }}
          releaseName: ${{ inputs.version_name }}
