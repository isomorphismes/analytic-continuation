name: Promote smooth orbit acceptance

on:
  push:
    branches:
      - experiment/wandering-offscreen-poles
    paths:
      - '.github/workflows/promote-smooth-orbits.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/wandering-offscreen-poles
          fetch-depth: 0

      - name: Align acceptance with canonical smooth orbits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          native_path = Path('.github/workflows/native-apk-release.yml')
          native = native_path.read_text()
          boundary = "          ! grep -RniE 'lasso_map|inverse_lasso|dragging_lasso|lasso_coefficients|continuation_path' android/app/src/main/cpp android/app/src/main/assets/continuation.frag.in\n"
          boundary_plus = boundary + "          grep -Fq '#define REMOTE_POLE_COUNT 24' android/app/src/main/assets/continuation.frag.in\n          grep -Fq 'uniform float u_remote_pole_time;' android/app/src/main/assets/continuation.frag.in\n          grep -Fq 'remote_pole_orbit_speed' android/app/src/main/assets/continuation.frag.in\n"
          if native.count(boundary) != 1:
              raise SystemExit('native boundary marker not unique')
          native = native.replace(boundary, boundary_plus, 1)

          brightness = "            awk -F= '/lavfi.signalstats.YAVG/ { average = $2 } /lavfi.signalstats.YMAX/ { maximum = $2 } END { exit !(average > 20.0 && maximum > 80.0) }' explorer-screen-stats.txt\n\n"
          first_set = native.index("            set -- $(sed -n", native.index(brightness) + len(brightness))
          placement_set = native.index("            set -- $(sed -n", first_set + 1)
          native = native[:first_set] + native[placement_set:]

          post_edit = "            grep -Eq 'pole added: .*count=2' analytic-continuation-emulator.log\n\n"
          resume_set = native.index("            set -- $(sed -n", native.index(post_edit) + len(post_edit))
          sleep_three = native.index("            sleep 3\n", resume_set)
          native = native[:resume_set] + native[sleep_three:]
          running = "            grep -Fq 'holomorphic field running' analytic-continuation-emulator.log\n"
          if native.count(running) != 1:
              raise SystemExit('running assertion not unique')
          native = native.replace(running, '', 1)
          native_path.write_text(native)

          holo_path = Path('.github/workflows/holomorphic-apk.yml')
          holo = holo_path.read_text()
          old_budget = "          grep -Fq '#define HOLOMORPHIC_WALK_COEFFICIENT_BUDGET 1.20f' android/app/src/main/cpp/holomorphic_walk.h\n"
          new_budget = "          grep -Fq '#define HOLOMORPHIC_WALK_COEFFICIENT_BUDGET 6.00f' android/app/src/main/cpp/holomorphic_walk.h\n"
          if holo.count(old_budget) != 1:
              raise SystemExit('old coefficient-budget assertion not unique')
          holo = holo.replace(old_budget, new_budget, 1)
          coeff_check = "          grep -Fq 'u_holomorphic_coefficients' android/app/src/main/assets/continuation.frag.in\n"
          orbit_checks = coeff_check + "          grep -Fq '#define REMOTE_POLE_COUNT 24' android/app/src/main/assets/continuation.frag.in\n          grep -Fq 'uniform float u_remote_pole_time;' android/app/src/main/assets/continuation.frag.in\n          grep -Fq 'remote_pole_orbit_speed' android/app/src/main/assets/continuation.frag.in\n"
          if holo.count(coeff_check) != 1:
              raise SystemExit('coefficient shader assertion not unique')
          holo = holo.replace(coeff_check, orbit_checks, 1)
          holo_path.write_text(holo)

          shader_path = Path('android/app/src/main/assets/continuation.frag.in')
          shader = shader_path.read_text()
          old_comment = "    // Twenty-four additional X singularities stay well outside the circumscribed\n    // visible region. They move continuously as the existing live state moves,\n    // and every fragment evaluates their meromorphic influence directly.\n"
          new_comment = "    // Twenty-four additional X singularities stay well outside the circumscribed\n    // visible region and follow smooth time-driven orbits around it.\n    // Every fragment evaluates their meromorphic influence directly.\n"
          if shader.count(old_comment) != 1:
              raise SystemExit('remote-pole comment not unique')
          shader = shader.replace(old_comment, new_comment, 1)
          shader_path.write_text(shader)
          PY

          rm .github/workflows/promote-smooth-orbits.yml
          git config user.name 'canonical-orbit-promoter'
          git config user.email 'canonical-orbit-promoter@users.noreply.github.com'
          git add .github/workflows/native-apk-release.yml \
                  .github/workflows/holomorphic-apk.yml \
                  android/app/src/main/assets/continuation.frag.in \
                  .github/workflows/promote-smooth-orbits.yml
          git diff --cached --check
          git commit -m 'Make smooth orbital poles the canonical acceptance'
          git push origin HEAD:experiment/wandering-offscreen-poles
