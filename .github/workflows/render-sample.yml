name: render sample

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "examples/zeta_smoke.json"
      - "examples/rational_disc_reveal_smoke.json"
      - "pyproject.toml"
      - ".github/workflows/render-sample.yml"

jobs:
  sample-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ManimGL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev xvfb xauth libgl1-mesa-dri
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[movie]'
      - name: Render zeta open-close sample
        env:
          ANALYTIC_CONTINUATION_SPEC: ${{ github.workspace }}/examples/zeta_smoke.json
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a manimgl \
            src/analytic_continuation/scene.py FunctionOpenClose \
            -w -l \
            --video_dir rendered \
            --file_name zeta-open-close
      - name: Render rational disc-reveal sample
        env:
          ANALYTIC_CONTINUATION_SPEC: ${{ github.workspace }}/examples/rational_disc_reveal_smoke.json
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a manimgl \
            src/analytic_continuation/scene.py FunctionOpenClose \
            -w -l \
            --video_dir rendered \
            --file_name rational-disc-reveal
      - uses: actions/upload-artifact@v4
        with:
          name: zeta-open-close
          path: rendered/**/zeta-open-close.mp4
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rational-disc-reveal
          path: rendered/**/rational-disc-reveal.mp4
          if-no-files-found: error
