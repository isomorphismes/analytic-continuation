[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytic-continuation"
version = "0.1.0"
description = "Render open-and-close movies of complex functions with ManimGL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mpmath==1.3.0",
]

[project.optional-dependencies]
movie = [
  "manimgl==1.7.2",
  # ManimGL 1.7.2 still imports pkg_resources at startup.
  "setuptools<81",
]

[project.scripts]
analytic-continuation = "analytic_continuation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
