[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytic-continuation"
version = "0.1.0"
description = "Reference models and a native Android explorer for analytic continuation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mpmath==1.3.0",
]

[project.scripts]
analytic-continuation = "analytic_continuation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
